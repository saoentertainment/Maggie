<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💜 Margarita Pressure</title>
  <meta name="description" content="Registro de presión arterial para Irma Margarita">
  <meta name="theme-color" content="#0a1929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 📱 Manifest PWA inline -->
  <script type="application/json" id="pwa-manifest">
  {
    "name": "Margarita Pressure",
    "short_name": "MargaritaBP",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#0a1929",
    "theme_color": "#0a1929",
    "icons": []
  }
  </script>

  <style>
    /* 🎨 PALETA TOTAL FEST */
    :root {
      --bg-dark: #0a1929;
      --card: #132f4c;
      --blue: #1976d2;
      --blue-light: #64b5f6;
      --purple: #8e24aa;
      --green: #4caf50;
      --yellow: #ffca28;
      --red: #ef5350;
      --white: #ffffff;
      --text-secondary: #b0bec5;
    }

    /* 🔄 RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 📱 PANTALLAS (solo 1 visible a la vez) */
    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }
/* 🏠 HOME */
.app-title {
  font-size: 28px;
  color: var(--blue-light);
  margin-bottom: 32px;
  text-align: center;
}

.last-reading {
  background: var(--card);
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  width: 100%;
  max-width: 340px;
  margin-bottom: 36px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.last-label {
  font-size: 16px;
  color: var(--text-secondary);
}

.last-value {
  font-size: 52px;
  font-weight: 700;
  color: var(--white);
}

.last-pulse {
  font-size: 22px;
  color: var(--blue-light);
}

.last-date {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 8px;
}

/* 🔘 BOTONES GIGANTES */
.home-buttons {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 340px;
}

.btn {
  border: none;
  border-radius: 16px;
  padding: 22px 16px;
  font-size: 20px;
  font-weight: 700;
  color: var(--white);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}

.btn:active {
  transform: scale(0.96);
}

.btn-purple {
  background: var(--purple);
  box-shadow: 0 4px 20px rgba(142, 36, 170, 0.4);
}

.btn-blue {
  background: var(--blue);
  box-shadow: 0 4px 20px rgba(25, 118, 210, 0.4);
}

.btn-green {
  background: var(--green);
  box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
} 
/* 📝 REGISTRO */
.register-title {
  font-size: 26px;
  color: var(--blue-light);
  margin-bottom: 28px;
}

.reg-row {
  background: var(--card);
  border-radius: 16px;
  padding: 18px 16px;
  width: 100%;
  max-width: 340px;
  margin-bottom: 14px;
}

.reg-label {
  display: block;
  font-size: 17px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.reg-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.reg-value {
  font-size: 44px;
  font-weight: 700;
  color: var(--white);
  min-width: 100px;
  text-align: center;
}

/* 🔘 BOTONES +/− GIGANTES */
.btn-step {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: none;
  font-size: 36px;
  font-weight: 700;
  color: var(--white);
  background: var(--blue);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, background 0.2s;
}

.btn-step:active {
  transform: scale(0.9);
  background: var(--blue-light);
}

/* Botón siguiente a ancho completo */
.btn-full {
  width: 100%;
  max-width: 340px;
  margin-top: 20px;
}    
  </style>
</head>
<body>

<!-- 📱 PANTALLA 1: HOME -->
<div id="screen-home" class="screen">

  <!-- Título -->
  <h1 class="app-title">💜 Margarita Pressure</h1>

  <!-- Última medición -->
  <div class="last-reading" id="last-reading">
    <span class="last-label">Última medición</span>
    <span class="last-value" id="last-value">-- / --</span>
    <span class="last-pulse" id="last-pulse">Pulso: --</span>
    <span class="last-date" id="last-date">Sin registros aún</span>
  </div>

  <!-- Botones principales -->
  <div class="home-buttons">
    <button class="btn btn-purple" id="btn-new">➕ NUEVA MEDICIÓN</button>
    <button class="btn btn-blue" id="btn-history">📋 HISTORIAL</button>
    <button class="btn btn-green" id="btn-report">📄 REPORTE</button>
  </div>

</div>

<!-- 📱 PANTALLA 2: REGISTRO -->
<div id="screen-register" class="screen active">

  <h2 class="register-title">📝 Nueva Medición</h2>

  <!-- 🕐 HORA -->
  <div class="reg-row" id="row-time">
    <span class="reg-label">🕐 Hora</span>
    <div class="reg-control">
      <button class="btn-step" id="time-minus">−</button>
      <span class="reg-value" id="time-value">--:--</span>
      <button class="btn-step" id="time-plus">＋</button>
    </div>
  </div>

  <!-- 💓 SISTÓLICA -->
  <div class="reg-row">
    <span class="reg-label">💓 Sistólica</span>
    <div class="reg-control">
      <button class="btn-step" id="sys-minus">−</button>
      <span class="reg-value" id="sys-value">120</span>
      <button class="btn-step" id="sys-plus">＋</button>
    </div>
  </div>

  <!-- 💗 DIASTÓLICA -->
  <div class="reg-row">
    <span class="reg-label">💗 Diastólica</span>
    <div class="reg-control">
      <button class="btn-step" id="dia-minus">−</button>
      <span class="reg-value" id="dia-value">80</span>
      <button class="btn-step" id="dia-plus">＋</button>
    </div>
  </div>

  <!-- ❤️ PULSO -->
  <div class="reg-row">
    <span class="reg-label">❤️ Pulso</span>
    <div class="reg-control">
      <button class="btn-step" id="pulse-minus">−</button>
      <span class="reg-value" id="pulse-value">72</span>
      <button class="btn-step" id="pulse-plus">＋</button>
    </div>
  </div>

  <!-- Botón siguiente -->
  <button class="btn btn-purple btn-full" id="btn-next">SIGUIENTE ➡️</button>

</div>

  <!-- 📱 PANTALLA 3: CONFIRMAR -->
  <div id="screen-confirm" class="screen">
    <h1>✅ CONFIRMAR</h1>
  </div>

  <!-- 📱 PANTALLA 4: HISTORIAL -->
  <div id="screen-history" class="screen">
    <h1>📋 HISTORIAL</h1>
  </div>

  <!-- 📱 PANTALLA 5: REPORTE -->
  <div id="screen-report" class="screen">
    <h1>📄 REPORTE</h1>
  </div>

  <script>
    // 🧠 Aquí irá toda la lógica (próximos pasos)
  </script>

</body>
</html>
