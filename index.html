<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💜 Margarita Pressure</title>
  <meta name="description" content="Registro de presión arterial para Irma Margarita">
  <meta name="theme-color" content="#0a1929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 📱 Manifest PWA inline -->
  <script type="application/json" id="pwa-manifest">
  {
    "name": "Margarita Pressure",
    "short_name": "MargaritaBP",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#0a1929",
    "theme_color": "#0a1929",
    "icons": []
  }
  </script>

  <style>
    /* 🎨 PALETA TOTAL FEST */
    :root {
      --bg-dark: #0a1929;
      --card: #132f4c;
      --blue: #1976d2;
      --blue-light: #64b5f6;
      --purple: #8e24aa;
      --green: #4caf50;
      --yellow: #ffca28;
      --red: #ef5350;
      --white: #ffffff;
      --text-secondary: #b0bec5;
    }

    /* 🔄 RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 📱 PANTALLAS (solo 1 visible a la vez) */
    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- 📱 PANTALLA 1: HOME -->
  <div id="screen-home" class="screen active">
    <h1>🏠 HOME</h1>
  </div>

  <!-- 📱 PANTALLA 2: REGISTRO -->
  <div id="screen-register" class="screen">
    <h1>📝 REGISTRO</h1>
  </div>

  <!-- 📱 PANTALLA 3: CONFIRMAR -->
  <div id="screen-confirm" class="screen">
    <h1>✅ CONFIRMAR</h1>
  </div>

  <!-- 📱 PANTALLA 4: HISTORIAL -->
  <div id="screen-history" class="screen">
    <h1>📋 HISTORIAL</h1>
  </div>

  <!-- 📱 PANTALLA 5: REPORTE -->
  <div id="screen-report" class="screen">
    <h1>📄 REPORTE</h1>
  </div>

  <script>
    // 🧠 Aquí irá toda la lógica (próximos pasos)
  </script>

</body>
</html>
