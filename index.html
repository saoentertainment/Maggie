<!DOCTYPE html>
<html lang="es">

        :root {
            --bg-dark: #0a1929;

            color: var(--text-main);

            text-align: center;

        }

        .app-header h1 {
            color: var(--blue-light);

        }

        .app-header p {
            color: var(--purple-accent);

            margin-top: 5px;
        }

</head>
