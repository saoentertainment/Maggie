<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margarita Pressure 💜</title>
    <style>
        :root {
            --bg-dark: #0a1929;
            --card-bg: #132f4c;
            --blue-primary: #1976d2;
            --blue-light: #64b5f6;
            --purple-accent: #8e24aa;
            --green-ok: #4caf50;
            --text-main: #e3f2fd;
            --font-size-big: 1.3rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            font-size: var(--font-size-big);
        }

        .app-header { text-align: center; padding: 20px 0; }
        .app-header h1 { color: var(--blue-light); font-size: 1.8rem; }
        .app-header p { color: var(--purple-accent); font-size: 1rem; margin-top: 5px; }

        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }

        .btn-upload {
            background: linear-gradient(135deg, var(--blue-primary), var(--purple-accent));
            color: white;
            border: none;
            border-radius: 20px;
            padding: 25px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(25, 118, 210, 0.4);
            transition: transform 0.2s;
            text-align: center;
        }

        .btn-upload:active { transform: scale(0.95); }

        .btn-upload span {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        #fileInput { display: none; }

        .preview-container { margin-top: 20px; text-align: center; }

        .preview-container img {
            max-width: 100%;
            border-radius: 15px;
            border: 3px solid var(--blue-light);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
                .status-msg {
            margin-top: 15px;
            color: var(--blue-light);
            font-size: 1.2rem;
            text-align: center;
        }

        .raw-text {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
            text-align: left;
            font-size: 1rem;
            border: 1px solid var(--blue-primary);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>💜 Margarita Pressure</h1>
        <p>Para Irma Margarita, con amor</p>
    </header>

    <section class="upload-section">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
            <span>📷</span>
            Medir mi presión
        </button>
        <input type="file" id="fileInput" accept="image/*">
    </section>

    <div class="preview-container" id="previewContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');

        // 🥽 GAFAS DEL ROBOT: limpia la foto para leer mejor
        async function prepararFoto(file) {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            await img.decode();

            const MAX = 1200;
            let escala = 2;
            if (img.width * 2 > MAX) escala = MAX / img.width;

            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * escala);
            canvas.height = Math.round(img.height * escala);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imageData.data;

            let suma = 0, min = 255, max = 0;
            const total = d.length / 4;
            const grises = new Array(total);
            for (let i = 0; i < d.length; i += 4) {
                const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                grises[i / 4] = g;
                suma += g;
                if (g < min) min = g;
                if (g > max) max = g;
            }
            const promedio = suma / total;
            const oscura = promedio < 128;

            // 🎯 Umbral inteligente: solo el "corazón" de los números
            const umbral = oscura
                ? (max + promedio) / 2    // foto oscura: solo lo muy brillante
                : (min + promedio) / 2;   // foto clara: solo lo muy oscuro

            for (let i = 0; i < d.length; i += 4) {
                let v = grises[i / 4] > umbral ? 255 : 0;
                if (oscura) v = 255 - v;
                d[i] = d[i + 1] = d[i + 2] = v;
            }

            // 🖼️ Borde blanco (al robot le gusta leer con margen)
            ctx.putImageData(imageData, 0, 0);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 40;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            return canvas.toDataURL('image/png');
        }

        fileInput.addEventListener('change', async function () {
            const file = this.files[0];
            if (!file) return;

            previewContainer.innerHTML = '<img src="' + URL.createObjectURL(file) + '" alt="Foto de tu medición">';

            const status = document.createElement('p');
            status.className = 'status-msg';
            status.innerText = '🥽 Poniéndome los lentes...';
            previewContainer.appendChild(status);

            try {
                const fotoLista = await prepararFoto(file);

                // 🤖 DEBUG: vemos cómo ve el robot
                const vistaRobot = document.createElement('div');
                vistaRobot.innerHTML = '<p class="status-msg">🤖 Así ve el robot:</p><img src="' + fotoLista + '" alt="Vista del robot" style="max-width:100%; border-radius:10px;">';
                previewContainer.appendChild(vistaRobot);

                status.innerText = '🔍 Leyendo tu foto... un momentito ☕';

                const worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            status.innerText = '🔍 Leyendo... ' + Math.round(m.progress * 100) + '%';
                        }
                    }
                });

                // 🤖 Robot terco: intenta 3 modos hasta encontrar números
                const modos = [
                    Tesseract.PSM.AUTO,
                    Tesseract.PSM.SPARSE_TEXT,
                    Tesseract.PSM.SINGLE_COLUMN
                ];

                let texto = '';
                for (const modo of modos) {
                    await worker.setParameters({
                        tessedit_char_whitelist: '0123456789',
                        tessedit_pageseg_mode: modo
                    });
                    const resultado = await worker.recognize(fotoLista);
                    texto = (resultado.data.text || '').trim();
                    if (texto) break;  // 🎉 ¡encontró números!
                }
                await worker.terminate();

                status.innerText = '✅ Esto fue lo que leí:';
                const raw = document.createElement('pre');
                raw.className = 'raw-text';
                raw.innerText = texto || '(no encontré números 😅)';
                previewContainer.appendChild(raw);
            } catch (error) {
                status.innerText = '❌ Ups, no pude leer la foto. Prueba con mejor luz 💡';
            }
        });
    </script>
</body>
</html>
