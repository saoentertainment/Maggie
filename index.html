<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💜 Margarita Pressure</title>
  <meta name="description" content="Registro de presión arterial para Irma Margarita">
  <meta name="theme-color" content="#0a1929">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 📱 Manifest PWA inline -->
  <script type="application/json" id="pwa-manifest">
  {
    "name": "Margarita Pressure",
    "short_name": "MargaritaBP",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#0a1929",
    "theme_color": "#0a1929",
    "icons": []
  }
  </script>

  <style>
    /* 🎨 PALETA TOTAL FEST */
    :root {
      --bg-dark: #0a1929;
      --card: #132f4c;
      --blue: #1976d2;
      --blue-light: #64b5f6;
      --purple: #8e24aa;
      --green: #4caf50;
      --yellow: #ffca28;
      --red: #ef5350;
      --white: #ffffff;
      --text-secondary: #b0bec5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }

    /* 🏠 HOME */
    .app-title {
      font-size: 28px;
      color: var(--blue-light);
      margin-bottom: 32px;
      text-align: center;
    }

    .last-reading {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .last-label { font-size: 16px; color: var(--text-secondary); }
    .last-value { font-size: 52px; font-weight: 700; color: var(--white); }
    .last-pulse { font-size: 22px; color: var(--blue-light); }
    .last-date { font-size: 15px; color: var(--text-secondary); margin-top: 8px; }

    /* 🔘 BOTONES */
    .home-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 340px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 22px 16px;
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active { transform: scale(0.96); }

    .btn-purple { background: var(--purple); box-shadow: 0 4px 20px rgba(142,36,170,0.4); }
    .btn-blue { background: var(--blue); box-shadow: 0 4px 20px rgba(25,118,210,0.4); }
    .btn-green { background: var(--green); box-shadow: 0 4px 20px rgba(76,175,80,0.4); }

    /* 📝 REGISTRO */
    .register-title {
      font-size: 26px;
      color: var(--blue-light);
      margin-bottom: 28px;
    }

    .reg-row {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 16px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 14px;
    }

    .reg-label {
      display: block;
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .reg-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reg-value {
      font-size: 44px;
      font-weight: 700;
      color: var(--white);
      min-width: 100px;
      text-align: center;
    }

    .btn-step {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      font-size: 36px;
      font-weight: 700;
      color: var(--white);
      background: var(--blue);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-step:active { transform: scale(0.9); background: var(--blue-light); }

    .btn-full { width: 100%; max-width: 340px; margin-top: 20px; }

    /* ✅ CONFIRMAR */
    .confirm-card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .confirm-bp { font-size: 56px; font-weight: 700; color: var(--white); }
    .confirm-pulse { font-size: 26px; color: var(--blue-light); }
    .confirm-time { font-size: 20px; color: var(--text-secondary); }

    .confirm-buttons {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-back {
      background: transparent;
      border: 2px solid var(--text-secondary);
      color: var(--text-secondary);
      box-shadow: none;
    }

    .btn-back:active { background: rgba(255,255,255,0.05); }

    /* 📋 HISTORIAL */
    .history-list {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 10px;
    }

    .history-empty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 20px;
      padding: 40px 0;
    }

    .history-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      border-left: 6px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-card.warning { border-left-color: var(--yellow); }
    .history-card.danger { border-left-color: var(--red); }

    .history-card-info { display: flex; flex-direction: column; gap: 2px; }
    .history-card-bp { font-size: 28px; font-weight: 700; color: var(--white); }
    .history-card-pulse { font-size: 18px; color: var(--blue-light); }
    .history-card-date { font-size: 14px; color: var(--text-secondary); }
    .history-card-status { font-size: 28px; }

    .history-card-delete {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.5;
      padding: 4px;
    }

    .history-card-delete:active { opacity: 1; }

    /* 📄 REPORTE */
    .report-box {
      background: var(--card);
      border-radius: 16px;
      padding: 20px 16px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 24px;
      flex: 1;
      overflow-y: auto;
      max-height: 55vh;
    }

    .report-text {
      font-size: 16px;
      color: var(--white);
      line-height: 1.7;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>

  <!-- 📱 PANTALLA 1: HOME -->
  <div id="screen-home" class="screen active">
    <h1 class="app-title">💜 Margarita Pressure</h1>
    <div class="last-reading">
      <span class="last-label">Última medición</span>
      <span class="last-value" id="last-value">-- / --</span>
      <span class="last-pulse" id="last-pulse">Pulso: --</span>
      <span class="last-date" id="last-date">Sin registros aún</span>
    </div>
    <div class="home-buttons">
      <button class="btn btn-purple" id="btn-new">➕ NUEVA MEDICIÓN</button>
      <button class="btn btn-blue" id="btn-history">📋 HISTORIAL</button>
      <button class="btn btn-green" id="btn-report">📄 REPORTE</button>
    </div>
  </div>

  <!-- 📱 PANTALLA 2: REGISTRO -->
  <div id="screen-register" class="screen">
    <h2 class="register-title">📝 Nueva Medición</h2>

    <div class="reg-row">
      <span class="reg-label">🕐 Hora</span>
      <div class="reg-control">
        <button class="btn-step" id="time-minus">−</button>
        <span class="reg-value" id="time-value">--:--</span>
        <button class="btn-step" id="time-plus">＋</button>
      </div>
    </div>

    <div class="reg-row">
      <span class="reg-label">💓 Sistólica</span>
      <div class="reg-control">
        <button class="btn-step" id="sys-minus">−</button>
        <span class="reg-value" id="sys-value">120</span>
        <button class="btn-step" id="sys-plus">＋</button>
      </div>
    </div>

    <div class="reg-row">
      <span class="reg-label">💗 Diastólica</span>
      <div class="reg-control">
        <button class="btn-step" id="dia-minus">−</button>
        <span class="reg-value" id="dia-value">80</span>
        <button class="btn-step" id="dia-plus">＋</button>
      </div>
    </div>

    <div class="reg-row">
      <span class="reg-label">❤️ Pulso</span>
      <div class="reg-control">
        <button class="btn-step" id="pulse-minus">−</button>
        <span class="reg-value" id="pulse-value">72</span>
        <button class="btn-step" id="pulse-plus">＋</button>
      </div>
    </div>

    <button class="btn btn-purple btn-full" id="btn-next">SIGUIENTE ➡️</button>
    <button class="btn btn-back btn-full" id="btn-home-from-register">← Volver</button>
  </div>

  <!-- 📱 PANTALLA 3: CONFIRMAR -->
  <div id="screen-confirm" class="screen">
    <h2 class="register-title">¿Guardar esta medición?</h2>
    <div class="confirm-card">
      <span class="confirm-bp" id="confirm-bp">120 / 80</span>
      <span class="confirm-pulse" id="confirm-pulse">❤️ Pulso: 72</span>
      <span class="confirm-time" id="confirm-time">🕐 09:30 AM</span>
    </div>
    <div class="confirm-buttons">
      <button class="btn btn-green btn-full" id="btn-save">✅ GUARDAR</button>
      <button class="btn btn-back" id="btn-back">← Corregir</button>
    </div>
  </div>

  <!-- 📱 PANTALLA 4: HISTORIAL -->
  <div id="screen-history" class="screen">
    <h2 class="register-title">📋 Historial</h2>
    <div class="history-list" id="history-list">
      <p class="history-empty">Aún no hay mediciones 💜</p>
    </div>
    <button class="btn btn-back btn-full" id="btn-home-from-history">← Volver</button>
  </div>

  <!-- 📱 PANTALLA 5: REPORTE -->
  <div id="screen-report" class="screen">
    <h2 class="register-title">📄 Reporte</h2>
    <div class="report-box" id="report-box">
      <p class="history-empty">Genera un reporte desde el historial 💜</p>
    </div>
    <div class="confirm-buttons">
      <button class="btn btn-blue btn-full" id="btn-copy-report">📋 Copiar reporte</button>
      <button class="btn btn-back btn-full" id="btn-home-from-report">← Volver</button>
    </div>
  </div>

<script>
// 🧠 MARGARITA PRESSURE - Cerebro

// 📱 SISTEMA DE PANTALLAS
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 🔢 VALORES ACTUALES
let sysValue = 120;
let diaValue = 80;
let pulseValue = 72;
let timeMinutes = 0;

// 💾 LECTURAS GUARDADAS
let readings = JSON.parse(localStorage.getItem('margarita_readings')) || [];

// 🔔 SONIDO "DING"
function playDing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

// 📳 VIBRACIÓN
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(100);
}

// 🕐 HORA: convertir minutos a formato 12h
function formatTime(mins) {
  let h = Math.floor(mins / 60);
  let m = mins % 60;
  let ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

// 🕐 Actualizar hora en pantalla
function updateTimeDisplay() {
  document.getElementById('time-value').textContent = formatTime(timeMinutes);
}

// 🔢 Actualizar números en pantalla
function updateDisplays() {
  document.getElementById('sys-value').textContent = sysValue;
  document.getElementById('dia-value').textContent = diaValue;
  document.getElementById('pulse-value').textContent = pulseValue;
  updateTimeDisplay();
}

// 🕐 Poner hora actual al entrar a REGISTRO
function setCurrentTime() {
  const now = new Date();
  timeMinutes = now.getHours() * 60 + now.getMinutes();
  timeMinutes = Math.round(timeMinutes / 5) * 5;
  if (timeMinutes >= 1440) timeMinutes = 0;
}

// 💾 GUARDAR MEDICIÓN
function saveReading() {
  const now = new Date();
  const reading = {
    id: Date.now(),
    sys: sysValue,
    dia: diaValue,
    pulse: pulseValue,
    timeMinutes: timeMinutes,
    date: now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0')
  };
  readings.unshift(reading); // nueva al inicio
  localStorage.setItem('margarita_readings', JSON.stringify(readings));
}

// 🏠 MOSTRAR ÚLTIMA MEDICIÓN EN HOME
function updateHomeDisplay() {
  if (readings.length === 0) {
    document.getElementById('last-value').textContent = '-- / --';
    document.getElementById('last-pulse').textContent = 'Pulso: --';
    document.getElementById('last-date').textContent = 'Sin registros aún';
    return;
  }
  const last = readings[0];
  document.getElementById('last-value').textContent = last.sys + ' / ' + last.dia;
  document.getElementById('last-pulse').textContent = 'Pulso: ' + last.pulse;
  document.getElementById('last-date').textContent = last.date + ' · ' + formatTime(last.timeMinutes);
}

// 🔘 NAVEGACIÓN
document.getElementById('btn-new').addEventListener('click', () => {
  setCurrentTime();
  updateDisplays();
  showScreen('screen-register');
});

document.getElementById('btn-history').addEventListener('click', () => {
  showScreen('screen-history');
});

document.getElementById('btn-report').addEventListener('click', () => {
  showScreen('screen-report');
});

document.getElementById('btn-next').addEventListener('click', () => {
  document.getElementById('confirm-bp').textContent = sysValue + ' / ' + diaValue;
  document.getElementById('confirm-pulse').textContent = '❤️ Pulso: ' + pulseValue;
  document.getElementById('confirm-time').textContent = '🕐 ' + formatTime(timeMinutes);
  showScreen('screen-confirm');
});

document.getElementById('btn-back').addEventListener('click', () => {
  showScreen('screen-register');
});

document.getElementById('btn-home-from-register').addEventListener('click', () => {
  showScreen('screen-home');
});

document.getElementById('btn-home-from-history').addEventListener('click', () => {
  showScreen('screen-home');
});

document.getElementById('btn-home-from-report').addEventListener('click', () => {
  showScreen('screen-home');
});

// ✅ GUARDAR
document.getElementById('btn-save').addEventListener('click', () => {
  saveReading();
  playDing();
  vibrate();
  updateHomeDisplay();
  showScreen('screen-home');
});

// ➕➖ HORA
document.getElementById('time-minus').addEventListener('click', () => {
  timeMinutes -= 5;
  if (timeMinutes < 0) timeMinutes = 1435;
  updateTimeDisplay();
});

document.getElementById('time-plus').addEventListener('click', () => {
  timeMinutes += 5;
  if (timeMinutes >= 1440) timeMinutes = 0;
  updateTimeDisplay();
});

// ➕➖ SISTÓLICA
document.getElementById('sys-minus').addEventListener('click', () => {
  if (sysValue > 60) sysValue--;
  updateDisplays();
});

document.getElementById('sys-plus').addEventListener('click', () => {
  if (sysValue < 250) sysValue++;
  updateDisplays();
});

// ➕➖ DIASTÓLICA
document.getElementById('dia-minus').addEventListener('click', () => {
  if (diaValue > 40) diaValue--;
  updateDisplays();
});

document.getElementById('dia-plus').addEventListener('click', () => {
  if (diaValue < 150) diaValue++;
  updateDisplays();
});

// ➕➖ PULSO
document.getElementById('pulse-minus').addEventListener('click', () => {
  if (pulseValue > 30) pulseValue--;
  updateDisplays();
});

document.getElementById('pulse-plus').addEventListener('click', () => {
  if (pulseValue < 200) pulseValue++;
  updateDisplays();
});

// 🚀 AL CARGAR: mostrar última medición
updateHomeDisplay();

</script>

</body>
</html>
